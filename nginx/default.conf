# Shared DASH segment cache — lets every viewer in a room reuse one Plex
# transcode session instead of each player pulling that session's single
# playhead in a different direction (a slow client requesting old segments
# froze the stream for everyone). Keyed on the resolved upstream Plex URL so
# all per-user watch tokens collapse onto the same cached segment.
#
# Segments are immutable (segment N of a session is always the same bytes), so
# a long lifetime is safe — a cache entry can never serve stale/wrong data.
# Keep them around for the length of a movie so pause and skip-back are served
# from cache instead of reaching back to Plex for an old segment behind the
# transcoder playhead (the original backward-seek freeze). `inactive` and the
# 3h `proxy_cache_valid` are deliberately long; `max_size` is the real governor
# — when the cache exceeds it, nginx evicts least-recently-used entries. Size it
# to spare disk: a 2h HEVC-remux movie is ~3-4 GB, so 8g holds roughly two
# concurrent parties' worth. Lower it if disk is tight.
proxy_cache_path /var/cache/nginx/dash levels=1:2 keys_zone=dash_cache:10m
                 max_size=8g inactive=3h use_temp_path=off;

# Diagnostic log format for DASH segments: records the cache result
# (HIT/MISS/EXPIRED), timing, and the resolved upstream URL so a slow viewer
# being served from cache (HIT) vs. hitting Plex (MISS) is visible per request.
log_format dashcache '$time_iso8601 cache=$upstream_cache_status status=$status '
                     'rt=$request_time '
                     'client=$remote_addr "$request" url="$upstream_url"';

server {
    listen 80;

    # Docker's embedded DNS — use resolver so bot hostname is looked up
    # dynamically at request time rather than at startup (required when
    # nginx is attached to multiple Docker networks).
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $bot "bot:3000";

    # ── Manifest (DASH MPD or HLS M3U8) ─────────────────────────────────────────
    # Must go through Node.js — URLs inside the manifest are rewritten to proxy
    # segments here rather than exposing the upstream server directly.
    location ~ ^/stream/[^/]+/manifest {
        proxy_pass         http://$bot;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── DASH segments ─────────────────────────────────────────────────────────────
    # nginx validates the session token via auth_request, then proxies segment
    # bytes directly from Plex — Node.js is out of the data path.
    location ~ ^/stream/[^/]+/dash/ {
        auth_request      /_internal/auth;
        auth_request_set  $upstream_url $upstream_http_x_upstream_url;

        # Decouple viewers from Plex's single-consumer transcoder. The per-user
        # /stream/<token>/ prefix is stripped during auth_request, so every
        # viewer in a room resolves to the SAME upstream Plex segment URL. Key
        # the cache on $upstream_url so Chrome and iPhone share one cached
        # segment. proxy_cache_lock collapses concurrent identical requests into
        # a single upstream fetch, so a second viewer never opens a parallel
        # request that would drag the shared transcoder's playhead; a slow client
        # requesting an already-produced segment gets a cache HIT and never
        # reaches Plex. Plex marks segments no-cache, so ignore those headers.
        proxy_cache               dash_cache;
        proxy_cache_key           $upstream_url;
        proxy_cache_lock          on;
        proxy_cache_lock_timeout  20s;
        # Keep segments for the length of a movie (see proxy_cache_path note):
        # immutable content, so a long TTL is safe and means pause / skip-back /
        # rejoin are served from cache instead of reaching back to Plex for an
        # old segment behind the playhead (the backward-seek freeze). max_size
        # governs eviction; this just stops time-based expiry from doing it.
        proxy_cache_valid         200 3h;
        proxy_ignore_headers      Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_ignore_client_abort on;
        add_header                X-Cache-Status $upstream_cache_status always;
        access_log                /var/log/nginx/access.log dashcache;

        proxy_pass              $upstream_url;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_buffering         on;
        proxy_request_buffering off;
        proxy_set_header        Host       $proxy_host;
        proxy_set_header        Connection "";
    }

    # ── HLS playlists (Jellyfin) ─────────────────────────────────────────────────
    location ~ ^/stream/[^/]+/hls/playlist\.m3u8 {
        proxy_pass         http://$bot;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── HLS segments (Jellyfin) ──────────────────────────────────────────────────
    location ~ ^/stream/[^/]+/hls/segment {
        auth_request      /_internal/auth;
        auth_request_set  $upstream_url $upstream_http_x_upstream_url;

        proxy_pass              $upstream_url;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_set_header        Host       $proxy_host;
        proxy_set_header        Connection "";
    }

    # ── Direct stream (range-request aware) ──────────────────────────────────────
    location ~ ^/stream/[^/]+/direct {
        auth_request      /_internal/auth;
        auth_request_set  $upstream_url $upstream_http_x_upstream_url;

        proxy_pass              $upstream_url;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_set_header        Host       $proxy_host;
        proxy_set_header        Connection "";
    }

    # ── Auth subrequest handler ───────────────────────────────────────────────────
    location = /_internal/auth {
        internal;
        set $auth_url "http://bot:3000/internal/auth";
        proxy_pass             $auth_url;
        proxy_pass_request_body off;
        proxy_set_header       Content-Length  "";
        proxy_set_header       X-Original-URI  $request_uri;
    }

    # ── Everything else → bot ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://$bot;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }
}
