server {
    listen 80;

    # Docker's embedded DNS — use resolver so bot hostname is looked up
    # dynamically at request time rather than at startup (required when
    # nginx is attached to multiple Docker networks).
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $bot "bot:3000";

    # ── HLS playlists ────────────────────────────────────────────────────────
    # Must go through Node.js — the M3U8 URLs need to be rewritten to proxy
    # the segments here rather than exposing the upstream server directly.
    location ~ ^/stream/[^/]+/hls/playlist\.m3u8 {
        proxy_pass         http://$bot;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── HLS segments ─────────────────────────────────────────────────────────
    # nginx validates the session token via auth_request, then proxies the
    # segment bytes directly from the upstream media server — Node.js is
    # completely out of the data path.
    location ~ ^/stream/[^/]+/hls/segment {
        auth_request      /_internal/auth;
        auth_request_set  $upstream_url $upstream_http_x_upstream_url;

        proxy_pass              $upstream_url;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_set_header        Host       $proxy_host;
        proxy_set_header        Connection "";
    }

    # ── Direct stream (range-request aware) ──────────────────────────────────
    # Same auth pattern; nginx forwards Range headers automatically.
    location ~ ^/stream/[^/]+/direct {
        auth_request      /_internal/auth;
        auth_request_set  $upstream_url $upstream_http_x_upstream_url;

        proxy_pass              $upstream_url;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_set_header        Host       $proxy_host;
        proxy_set_header        Connection "";
    }

    # ── Auth subrequest handler ───────────────────────────────────────────────
    # Marked internal — only nginx can call this, not external clients.
    # Passes the original URI so the bot knows which token/segment to validate.
    location = /_internal/auth {
        internal;
        set $auth_url "http://bot:3000/internal/auth";
        proxy_pass             $auth_url;
        proxy_pass_request_body off;
        proxy_set_header       Content-Length  "";
        proxy_set_header       X-Original-URI  $request_uri;
    }

    # ── Everything else → bot ─────────────────────────────────────────────────
    # Covers: /watch, /sync (WebSocket), /img, /health, /internal/* (blocked
    # externally because /_internal/auth is `internal` in nginx).
    location / {
        proxy_pass         http://$bot;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }
}
