name: Build and push Docker image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bukowskaii/discordwatchparty

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so the release step can read the annotated tag message.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (bot)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (bot)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (nginx)
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (nginx)
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Use the annotated tag's message as the release title + body. Authoring
      # release notes in the tag (git tag -a) keeps them versioned and means
      # every release picks them up with no per-release workflow change.
      - name: Extract release notes from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          # actions/checkout leaves the pushed tag as a lightweight ref, so
          # re-fetch it to recover the annotated tag object (the message lives there).
          git fetch --tags --force
          echo "subject=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.subject }}
          # GitHub prepends `body` to the auto-generated "What's Changed" notes.
          # (No append_body: it appends to any *existing* release body, which
          # accumulates the notes across re-runs of the same tag.)
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
