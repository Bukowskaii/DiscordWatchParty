name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: As a host, I want … so that …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketch the behavior or UX.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you set them aside.
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for a similar request.
          required: true
        - label: I understand new work targets Plex (Jellyfin/Emby is untested).
          required: true
