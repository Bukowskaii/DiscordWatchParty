<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/img/logo.jpg" />
  <title>Watch Party Bot</title>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid #1e1e1e;
    }

    header img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    #header-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ccc;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #status {
      font-size: 0.75rem;
      color: #555;
      flex-shrink: 0;
    }

    /* ── Main content ────────────────────────────────────────────────────── */
    main {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }

    /* ── Waiting state ───────────────────────────────────────────────────── */
    #waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    #waiting img {
      width: clamp(140px, 25vw, 220px);
      height: clamp(140px, 25vw, 220px);
      border-radius: 50%;
      object-fit: cover;
      opacity: 0.85;
      filter: drop-shadow(0 0 24px rgba(255,255,255,0.06));
    }

    #waiting p {
      font-size: 1rem;
      color: #666;
    }

    /* ── Player ──────────────────────────────────────────────────────────── */
    #now-playing-title {
      font-size: 1rem;
      font-weight: 600;
      max-width: min(90vw, 900px);
      text-align: center;
      color: #ddd;
    }

    #player-row {
      display: flex;
      gap: 12px;
      width: min(90vw, 160vh);
      align-items: flex-start;
    }

    #player-wrap {
      flex: 1;
      min-width: 0;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────────── */
    #sidebar {
      width: 150px;
      flex-shrink: 0;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    #participant-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #participant-list li {
      font-size: 0.8rem;
      color: #bbb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #participant-list li::before {
      content: '● ';
      font-size: 0.5rem;
      color: #4caf50;
      vertical-align: middle;
      margin-right: 2px;
    }

    @media (max-width: 580px) {
      #sidebar { display: none; }
    }

    /* ── Controls ────────────────────────────────────────────────────────── */
    #controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background: #242424;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 7px 18px;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #303030; }

    #time {
      font-size: 0.825rem;
      color: #888;
      min-width: 110px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ── Name prompt overlay ─────────────────────────────────────────────── */
    #name-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    #name-dialog {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: min(340px, 90vw);
      text-align: center;
    }

    #name-dialog h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    #name-dialog p {
      font-size: 0.85rem;
      color: #666;
      margin-top: -8px;
    }

    #name-submit {
      background: #5865f2;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 9px;
      transition: background 0.15s;
    }
    #name-submit:hover { background: #4752c4; }

    /* ── Toast notifications ─────────────────────────────────────────────── */
    #notifications {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
    }

    .toast {
      background: rgba(25, 25, 25, 0.95);
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.82rem;
      color: #bbb;
      max-width: 240px;
      animation: toastIn 0.2s ease;
      transition: opacity 0.4s;
    }

    @keyframes toastIn {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Join gate (the click also unlocks browser autoplay) -->
  <div id="name-overlay">
    <div id="name-dialog">
      <h2>Join the watch party</h2>
      <p>Playback stays in sync with everyone else. Join the party's voice channel to show up in the Watching list.</p>
      <button id="name-submit">Join</button>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="notifications"></div>

  <header>
    <img src="/img/logo.jpg" alt="Watch Party Bot logo" />
    <span id="header-title">Watch Party Bot</span>
    <span id="status">Connecting…</span>
  </header>

  <main>
    <!-- Waiting / idle state -->
    <div id="waiting">
      <img src="/img/logo.jpg" alt="Watch Party Bot" />
      <p>Waiting for the host to start something…</p>
    </div>

    <!-- Active player state (hidden until media loads) -->
    <div id="now-playing-title" style="display:none"></div>
    <div id="player-row" style="display:none">
      <div id="player-wrap">
        <video id="video" playsinline></video>
      </div>
      <div id="sidebar">
        <span class="sidebar-label">Watching</span>
        <ul id="participant-list"></ul>
      </div>
    </div>
    <div id="controls" style="display:none">
      <button id="btn-pause">Pause</button>
      <div id="time">0:00 / 0:00</div>
      <button id="btn-sync">Re-sync</button>
    </div>
  </main>

  <script>
    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      document.body.innerHTML = '<p style="padding:2rem;color:#e44">Invalid or expired watch link.</p>';
      throw new Error('no token');
    }

    const video       = document.getElementById('video');
    const playerRow   = document.getElementById('player-row');
    const waiting     = document.getElementById('waiting');
    const controls    = document.getElementById('controls');
    const statusEl    = document.getElementById('status');
    const headerTitle = document.getElementById('header-title');
    const npTitle     = document.getElementById('now-playing-title');
    const timeEl      = document.getElementById('time');
    const btnPause    = document.getElementById('btn-pause');
    const btnSync     = document.getElementById('btn-sync');

    let player = null;
    let currentMediaId = null;
    let durationMs = 0;
    let syncTarget = null;
    let suppressSync = false;

    // ── Join gate ───────────────────────────────────────────────────────────
    // No name needed — the Watching list is driven by who's in the voice
    // channel. This click also satisfies the browser's autoplay gesture
    // requirement so synced playback can start.
    const nameOverlay = document.getElementById('name-overlay');
    const nameSubmit  = document.getElementById('name-submit');

    function joinParty() {
      nameOverlay.style.display = 'none';
      // If something is already playing, start it now (we're inside the gesture).
      if (syncTarget) applySync(syncTarget.state, syncTarget.currentTimeMs);
    }

    nameSubmit.addEventListener('click', joinParty);

    // ── Toast notifications ───────────────────────────────────────────────────
    const notifContainer = document.getElementById('notifications');

    function showToast(text) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = text;
      notifContainer.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 400);
      }, 3500);
    }

    const participantList = document.getElementById('participant-list');

    function updateParticipants(names) {
      participantList.innerHTML = '';
      for (const name of names) {
        const li = document.createElement('li');
        li.textContent = name;
        participantList.appendChild(li);
      }
    }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') +
                  '://' + location.host + '/sync?token=' + token;
    let ws;

    function connect() {
      ws = new WebSocket(wsUrl);
      ws.onopen  = () => {
        statusEl.textContent = '●  Live';
        statusEl.style.color = '#4caf50';
      };
      ws.onmessage = ev => handleServer(JSON.parse(ev.data));
      ws.onclose = () => {
        statusEl.textContent = 'Reconnecting…';
        statusEl.style.color = '#888';
        setTimeout(connect, 3000);
      };
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    // ── Server message handler ────────────────────────────────────────────────
    function handleServer(msg) {
      switch (msg.type) {
        case 'notification':
          showToast(msg.text);
          break;

        case 'participants':
          updateParticipants(msg.names);
          break;

        case 'state':
        case 'sync':
          if (msg.ratingKey && msg.ratingKey !== currentMediaId) {
            loadMedia(msg.ratingKey, msg.title, msg.durationMs ?? 0);
          }
          if (msg.state === 'stopped') {
            showWaiting();
          } else {
            applySync(msg.state, msg.currentTimeMs);
          }
          break;

        case 'media':
          loadMedia(msg.ratingKey, msg.title, msg.durationMs ?? 0);
          applySync('playing', 0);
          break;

        case 'play':
          applySync('playing', msg.currentTimeMs ?? video.currentTime * 1000);
          break;

        case 'pause':
          applySync('paused', msg.currentTimeMs);
          break;

        case 'seek':
          seekTo(msg.currentTimeMs);
          break;

        case 'stopped':
          showWaiting();
          break;
      }
    }

    // ── Media loading ─────────────────────────────────────────────────────────
    shaka.polyfill.installAll();

    async function loadMedia(mediaId, title, dur) {
      currentMediaId = mediaId;
      durationMs = dur;

      const displayTitle = title ?? '';
      npTitle.textContent = displayTitle;
      headerTitle.textContent = displayTitle || 'Watch Party Bot';

      if (!player) {
        player = new shaka.Player();
        await player.attach(video);
      } else {
        await player.unload();
      }

      try {
        await player.load(`/stream/${token}/manifest`);
      } catch (err) {
        console.error('Shaka load error:', err);
      }

      waiting.style.display = 'none';
      npTitle.style.display = '';
      playerRow.style.display = '';
      controls.style.display = '';
    }

    function showWaiting() {
      playerRow.style.display = 'none';
      npTitle.style.display = 'none';
      controls.style.display = 'none';
      waiting.style.display = '';
      headerTitle.textContent = 'Watch Party Bot';
      currentMediaId = null;
    }

    // ── Sync ──────────────────────────────────────────────────────────────────
    function applySync(state, currentTimeMs) {
      syncTarget = { state, currentTimeMs, setAt: Date.now() };
      if (state === 'paused') {
        video.pause();
        seekTo(currentTimeMs);
      } else if (state === 'playing') {
        seekTo(currentTimeMs);
        video.play().catch(() => {});
      }
      btnPause.textContent = state === 'playing' ? 'Pause' : 'Play';
    }

    function seekTo(ms) {
      suppressSync = true;
      video.currentTime = ms / 1000;
      setTimeout(() => { suppressSync = false; }, 500);
    }

    // ── Controls ──────────────────────────────────────────────────────────────
    btnPause.addEventListener('click', () => {
      send({ type: video.paused ? 'play' : 'pause' });
    });

    btnSync.addEventListener('click', () => {
      if (!syncTarget) return;
      const elapsed = syncTarget.state === 'playing' ? Date.now() - syncTarget.setAt : 0;
      seekTo(syncTarget.currentTimeMs + elapsed);
    });

    // ── Time display + drift correction ───────────────────────────────────────
    video.addEventListener('timeupdate', () => {
      if (suppressSync) return;
      const cur = video.currentTime * 1000;
      timeEl.textContent = fmt(cur) + ' / ' + fmt(durationMs);

      if (syncTarget && syncTarget.state === 'playing' && !video.paused) {
        const expected = syncTarget.currentTimeMs + (Date.now() - syncTarget.setAt);
        // Only correct drift when the player has data to play; seeking while
        // buffering flushes the buffer and makes things worse.
        if (Math.abs(cur - expected) > 5000 && video.readyState >= 3) seekTo(expected);
      }
    });

    function fmt(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      if (h > 0) return h + ':' + pad(m % 60) + ':' + pad(s % 60);
      return m + ':' + pad(s % 60);
    }
    function pad(n) { return String(n).padStart(2, '0'); }

    connect();
  </script>
</body>
</html>
