services:
  nginx:
    image: nginx:alpine
    container_name: discordwatchparty-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8780}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bot

  bot:
    image: ghcr.io/bukowskaii/discordwatchparty:latest
    # build: .  # uncomment to build locally instead of pulling from ghcr.io
    container_name: discordwatchparty-bot
    restart: unless-stopped
    volumes:
      # Persists the SQLite database across container restarts and rebuilds
      - ./data:/app/data
    env_file:
      - .env
    # If your media servers run on the host machine, uncomment this so the
    # bot and nginx can reach them via host.docker.internal:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
